services:
  patchforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PATCHFORGE_DATA_DIR: /app/.patchforge_data
      PATCHFORGE_RUNS_DIR: /app/.patchforge_runs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

